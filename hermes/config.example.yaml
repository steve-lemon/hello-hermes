mcp_servers:
  steve_npx_tool:
    command: "node"
    args:
      - "<PROJECT_ROOT>/dist/mcp/server.js"
    env:
      TOOL_WORKSPACE: "<TOOL_WORKSPACE>"
    tools:
      include:
        - health_check
        - run_job
        - inspect_result

skills:
  external_dirs:
    - "<PROJECT_ROOT>/skills"
